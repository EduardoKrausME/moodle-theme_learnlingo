name: Import LearnLingo website into docs

on:
  push:
    branches: [master]
    paths: ['.github/workflows/import-learnlingo-site.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Mirror published site
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://learnlingo.eduardokraus.chatgpt.site/"
          mkdir -p docs
          wget \
            --execute robots=off \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --no-host-directories \
            --directory-prefix=docs \
            --user-agent="Mozilla/5.0 (compatible; LearnLingoSiteMirror/1.0)" \
            --timeout=30 \
            --tries=3 \
            "$source_url"
          test -s docs/index.html
          if ! grep -qi "learnlingo" docs/index.html; then
            echo "Downloaded page does not appear to be LearnLingo" >&2
            exit 1
          fi
          touch docs/.nojekyll
          printf "Mirrored files:\n"
          find docs -type f -printf '%P (%s bytes)\n' | sort
      - name: Commit site to docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Publish LearnLingo website snapshot in docs'
          git push origin HEAD:master
