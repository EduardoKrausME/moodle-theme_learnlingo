name: Import and verify LearnLingo website in docs

on:
  push:
    branches: [master]
    paths: ['.github/workflows/import-learnlingo-site.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Mirror published site into temporary directory
        shell: bash
        run: |
          set -euo pipefail
          source_url="https://learnlingo.eduardokraus.chatgpt.site/"
          mirror_dir="$(mktemp -d)"
          wget \
            --execute robots=off \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --no-host-directories \
            --directory-prefix="$mirror_dir" \
            --user-agent="Mozilla/5.0 (compatible; LearnLingoSiteMirror/1.0)" \
            --timeout=30 \
            --tries=3 \
            "$source_url"
          test -s "$mirror_dir/index.html"
          if ! grep -qi "learnlingo" "$mirror_dir/index.html"; then
            echo "Downloaded page does not appear to be LearnLingo" >&2
            exit 1
          fi
          mkdir -p docs
          rsync -a --delete "$mirror_dir/" docs/
          python3 .github/scripts/strip-cf-injection.py
          touch docs/.nojekyll
          printf "Mirrored files:\n"
          find docs -type f -printf '%P (%s bytes)\n' | sort
          echo "Changes against previous snapshot:"
          git status --short docs
      - name: Validate files, local links, page sections and features
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/audit-learnlingo-site.py
          for script in docs/*.js; do
            node --check "$script"
          done
          printf '\nJavaScript syntax checks passed.\n'
      - name: Publish audit summary
        if: always()
        shell: bash
        run: |
          if test -f /tmp/learnlingo-site-audit.md; then
            cat /tmp/learnlingo-site-audit.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Site download or validation failed before the report was generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit verified website to docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs
          if git diff --cached --quiet; then
            echo 'Site is already identical to the published source.'
            exit 0
          fi
          git commit -m 'Sync and verify LearnLingo website in docs'
          git push origin HEAD:master
